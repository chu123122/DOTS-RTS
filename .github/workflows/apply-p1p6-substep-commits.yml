name: Apply P1P6 substep commits

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: codex/contact-pipeline-parallel-p1-p6-final
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and inspect bundle
        shell: bash
        run: |
          set -euo pipefail
          for part in .codex/p1p6-bundle/part-{0..3}.b64; do test -f "$part"; done
          cat .codex/p1p6-bundle/part-{0..3}.b64 | base64 --decode > /tmp/p1p6.bundle
          git bundle verify /tmp/p1p6.bundle
          rm -rf /tmp/p1p6-source
          git clone -q /tmp/p1p6.bundle /tmp/p1p6-source
          mapfile -t commits < <(git -C /tmp/p1p6-source rev-list --reverse export-six)
          test "${#commits[@]}" -eq 7

      - name: Apply six commits
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout -B p1p6-result "origin/$TARGET_BRANCH"
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          mapfile -t commits < <(git -C /tmp/p1p6-source rev-list --reverse export-six)
          for ((i = 1; i < ${#commits[@]}; i++)); do
            git -C /tmp/p1p6-source format-patch -1 --stdout "${commits[$i]}" | git am
          done

      - name: Validate result
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-list --count "origin/$TARGET_BRANCH"..HEAD)" -eq 6
          test "$(git diff --name-only "origin/$TARGET_BRANCH"..HEAD | wc -l)" -eq 1
          git diff --check "origin/$TARGET_BRANCH"..HEAD
          grep -q 'CountP1P6EnvelopeEscapeBlocksJob' Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/ParallelContactPipelineP1P6.cs
          grep -q 'PrepareP1P6SubstepRepairClassificationJob' Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/ParallelContactPipelineP1P6.cs
          grep -q 'ReduceP1P6VelocityBodyBlocksJob' Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/ParallelContactPipelineP1P6.cs

      - name: Push target branch
        shell: bash
        run: git push origin "HEAD:refs/heads/$TARGET_BRANCH"
