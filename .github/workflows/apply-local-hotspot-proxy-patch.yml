name: Apply local-hotspot proxy patch

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: codex/contact-pipeline-parallel-p1-p6-final
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Preserve patch script
        shell: bash
        run: cp .codex/remove_global_proxy_validation.py /tmp/remove_global_proxy_validation.py

      - name: Apply patch to target branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout -B target "origin/$TARGET_BRANCH"
          python /tmp/remove_global_proxy_validation.py

      - name: Validate source structure
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          files=(
            Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Persistent/IncrementalPredictiveContactPipeline.cs
            Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Persistent/PersistentParallelClassificationP1P6.cs
            Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/ParallelContactPipelineP1P6.cs
          )
          test "$(git diff --name-only | wc -l)" -eq 3
          ! grep -R "ValidateAndClassifyIncrementalDirtyBodies" "${files[@]}"
          ! grep -R "UpdatePersistentProxyMetadata();" "${files[@]}"
          grep -R "RefreshIncrementalDirtyProxySetP1P6" "${files[@]}"
          grep -R "UpdatePersistentProxyMetadataForDirtyBodiesP1P6" "${files[@]}"
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Persistent/IncrementalPredictiveContactPipeline.cs'),
              Path('Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Persistent/PersistentParallelClassificationP1P6.cs'),
              Path('Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/ParallelContactPipelineP1P6.cs'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              depth = 0
              in_string = False
              escape = False
              for ch in text:
                  if in_string:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == '"':
                          in_string = False
                      continue
                  if ch == '"':
                      in_string = True
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth < 0:
                          raise SystemExit(f'negative brace depth: {path}')
              if depth != 0:
                  raise SystemExit(f'unbalanced braces ({depth}): {path}')
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git add \
            Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Persistent/IncrementalPredictiveContactPipeline.cs \
            Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Persistent/PersistentParallelClassificationP1P6.cs \
            Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/ParallelContactPipelineP1P6.cs
          git commit -m "perf: restrict persistent proxy updates to local hotspots"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
