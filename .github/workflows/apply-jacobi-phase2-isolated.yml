name: Apply isolated Jacobi phase 2

on:
  pull_request:
    branches:
      - Simulation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/migrate-contact-pipeline-stage-a-g
          fetch-depth: 0
      - name: Build atomic business commit
        shell: bash
        run: |
          set -euo pipefail
          base=99750116c6f3edac1402cddbfe2b86657359b3f3
          base64 -d .github/jacobi/phase2.patch.gz.b64 | gzip -d > /tmp/phase2.patch
          git reset --hard "$base"
          git apply --check /tmp/phase2.patch
          git apply /tmp/phase2.patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'feat: add serial Jacobi contact reference' | git commit-tree "$tree" -p "$base")
          git push --force origin "$commit":codex/migrate-contact-pipeline-stage-a-g
