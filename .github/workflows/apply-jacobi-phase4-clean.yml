name: Diagnose clean Jacobi phase 4 payload

on:
  pull_request:
    branches:
      - Simulation

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/apply-jacobi-phase4-clean
      - name: Decode payload without early exit
        shell: bash
        run: |
          set +e
          : > /tmp/phase4-payload-report.txt
          wc -c .github/jacobi/phase4-clean.patch.gz.b64 >> /tmp/phase4-payload-report.txt 2>&1
          base64 -d .github/jacobi/phase4-clean.patch.gz.b64 > /tmp/phase4.patch.gz 2>> /tmp/phase4-payload-report.txt
          echo "base64_status=$?" >> /tmp/phase4-payload-report.txt
          wc -c /tmp/phase4.patch.gz >> /tmp/phase4-payload-report.txt 2>&1
          gzip -t /tmp/phase4.patch.gz >> /tmp/phase4-payload-report.txt 2>&1
          echo "gzip_test_status=$?" >> /tmp/phase4-payload-report.txt
          gzip -dc /tmp/phase4.patch.gz > /tmp/phase4.patch 2>> /tmp/phase4-payload-report.txt
          echo "gzip_decode_status=$?" >> /tmp/phase4-payload-report.txt
          wc -c /tmp/phase4.patch >> /tmp/phase4-payload-report.txt 2>&1
          head -n 10 /tmp/phase4.patch >> /tmp/phase4-payload-report.txt 2>&1
          echo '---TAIL---' >> /tmp/phase4-payload-report.txt
          tail -n 10 /tmp/phase4.patch >> /tmp/phase4-payload-report.txt 2>&1
          cat /tmp/phase4-payload-report.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: phase4-payload-diagnostics
          path: |
            /tmp/phase4-payload-report.txt
            /tmp/phase4.patch.gz
            /tmp/phase4.patch
          if-no-files-found: warn
