name: Diagnose clean Jacobi phase 4 payload

on:
  pull_request:
    branches:
      - Simulation

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/apply-jacobi-phase4-clean
      - name: Decode payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/jacobi/phase4-clean.patch.gz.b64 > /tmp/phase4.patch.gz
          gzip -dc /tmp/phase4.patch.gz > /tmp/phase4.patch
          {
            wc -c .github/jacobi/phase4-clean.patch.gz.b64
            wc -c /tmp/phase4.patch.gz
            wc -c /tmp/phase4.patch
            head -n 20 /tmp/phase4.patch
            echo '---TAIL---'
            tail -n 20 /tmp/phase4.patch
          } > /tmp/phase4-payload-report.txt
          cat /tmp/phase4-payload-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phase4-payload-diagnostics
          path: |
            /tmp/phase4-payload-report.txt
            /tmp/phase4.patch
          if-no-files-found: error
