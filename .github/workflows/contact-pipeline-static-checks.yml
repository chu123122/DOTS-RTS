name: Contact pipeline static checks

on:
  pull_request:
    paths:
      - 'Entities/Unit/Systems/FlowField/**'
      - '.github/workflows/contact-pipeline-static-checks.yml'
  push:
    branches:
      - Simulation
      - 'codex/**'
    paths:
      - 'Entities/Unit/Systems/FlowField/**'
      - '.github/workflows/contact-pipeline-static-checks.yml'

permissions:
  contents: read

jobs:
  static-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject legacy execution symbols
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          flow = Path('Entities/Unit/Systems/FlowField')
          source = '\n'.join(p.read_text(encoding='utf-8') for p in flow.rglob('*.cs'))
          names = [
              'BuildAdaptiveFatAabbHotspots',
              'BuildAdaptiveHybridContactPairs',
              'BuildContactPairsFromFatAabbCache',
              'EnsureFatAabbRawCandidates',
              'UpdateAdaptiveFatAabbHistoryAfterSolve',
              'AreCorrectedDiscsInsideFatCache'
          ]
          found = [name for name in names if re.search(rf'\b{re.escape(name)}\b', source)]
          if found:
              raise SystemExit('Legacy execution symbols returned: ' + ', '.join(found))
          PY

      - name: Reject ShadowStatistics field
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Rnw --include='*.cs' 'Entities/Unit/Systems/FlowField' \
            -e 'ShadowStatistics'

      - name: Reject LegacyBroadPhaseStatistics field
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Rnw --include='*.cs' 'Entities/Unit/Systems/FlowField' \
            -e 'LegacyBroadPhaseStatistics'

      - name: Reject LegacyBroadPhaseSource field
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Rnw --include='*.cs' 'Entities/Unit/Systems/FlowField' \
            -e 'LegacyBroadPhaseSource'

      - name: Reject MappedFatCachePairs field
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Rnw --include='*.cs' 'Entities/Unit/Systems/FlowField' \
            -e 'MappedFatCachePairs'

      - name: Reject legacy jobs hierarchy
        shell: bash
        run: |
          set -euo pipefail
          test ! -e Entities/Unit/Systems/FlowField/Jobs/Legacy

      - name: Validate compatibility boundary and scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          pipeline = Path('Entities/Unit/Systems/FlowField/Jobs/ContactPipeline')
          production = '\n'.join(p.read_text(encoding='utf-8') for p in pipeline.rglob('*.cs'))
          occurrences = [
              str(path) for path in pipeline.rglob('*.cs')
              if 'FatAabbCacheMargin' in path.read_text(encoding='utf-8')
          ]
          expected = str(pipeline / 'Core/ContactPipelineConfiguration.cs')
          if occurrences != [expected]:
              raise SystemExit(
                  'Serialized FatAabb margin escaped compatibility boundary: ' +
                  repr(occurrences))
          if re.search(
                  r'\b(?:SleepingBody|SleepingIsland|ContactIslandSleeping)\b',
                  production):
              raise SystemExit(
                  'Sleeping policy introduced without a dedicated design stage')
          PY

      - name: Validate type ownership and temporary artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          flow = Path('Entities/Unit/Systems/FlowField')
          pipeline = flow / 'Jobs/ContactPipeline'
          ownership = {
              'public struct UnitCollisionPair':
                  pipeline / 'Core/ContactPairTypes.cs',
              'public struct SweptDiscCellEntry':
                  pipeline / 'BroadPhase/SweptDiscTypes.cs',
              'public struct IncrementalContactCacheState':
                  pipeline / 'Persistent/IncrementalPredictiveContactTypes.cs',
              'public struct IncrementalContactPipelineStatistics':
                  flow / 'Diagnostics/Capture/ContactPipelineTelemetry.cs'
          }
          for symbol, expected_path in ownership.items():
              paths = [
                  path for path in flow.rglob('*.cs')
                  if symbol in path.read_text(encoding='utf-8')
              ]
              if paths != [expected_path]:
                  raise SystemExit(f'{symbol} ownership mismatch: {paths}')
          runtime_types = (
              pipeline / 'Persistent/IncrementalPredictiveContactTypes.cs'
          ).read_text(encoding='utf-8')
          telemetry = (
              flow / 'Diagnostics/Capture/ContactPipelineTelemetry.cs'
          ).read_text(encoding='utf-8')
          if 'Nanoseconds' in runtime_types or 'OraclePairCount' in runtime_types:
              raise SystemExit('Telemetry leaked into authoritative runtime state')
          if 'IncrementalContactCacheState' in telemetry:
              raise SystemExit('Runtime cache state leaked into telemetry schema')
          temp = list(Path('.github/workflows').glob(
              'refactor-contact-pipeline-phase*.yml'))
          temp += list(Path('.github/workflows').glob('audit-*.yml'))
          if temp:
              raise SystemExit('Temporary workflows remain: ' + repr(temp))
          PY

      - name: Validate diagnostics source layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path('Entities/Unit/Systems/FlowField')
          expected = [
              root / 'Diagnostics/Capture/ContactPipelineTelemetry.cs',
              root / 'Diagnostics/Capture/IncrementalContactPipelineDiagnostics.cs',
              root / 'Diagnostics/Capture/SimulationDebuggerSnapshotPublishing.cs',
              root / 'Diagnostics/Capture/Jobs/PublishPredictiveDiscContactStatisticsJob.cs',
              root / 'Diagnostics/Capture/Jobs/Stage3ContactDiagnosticRecorder.cs',
              root / 'Diagnostics/Instrumentation/ContactPipelineProfilerClock.cs',
              root / 'Diagnostics/Validation/IncrementalContactOracle.cs',
              root / 'Diagnostics/README.md'
          ]
          missing = [str(path) for path in expected if not path.exists()]
          if missing:
              raise SystemExit('Diagnostics ownership files missing: ' + repr(missing))
          legacy = [
              root / 'Diagnostics/ContactPipelineTelemetry.cs',
              root / 'Diagnostics/IncrementalContactPipelineDiagnostics.cs',
              root / 'Diagnostics/SimulationDebuggerSnapshotPublishing.cs',
              root / 'Jobs/PublishPredictiveDiscContactStatisticsJob.cs',
              root / 'Jobs/Stage3ContactDiagnosticRecorder.cs',
              root / 'Jobs/IncrementalContactOracle.cs',
              root / 'Jobs/ContactPipeline/Core/ContactPipelineProfilerClock.cs'
          ]
          returned = [str(path) for path in legacy if path.exists()]
          if returned:
              raise SystemExit('Diagnostics files returned to runtime folders: ' + repr(returned))
          PY

      - name: Validate diagnostics schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          csv_path = Path(
              'Entities/Unit/Systems/FlowField/Diagnostics/'
              'IncrementalContactPipelineCsvRecorder.cs')
          csv_text = csv_path.read_text(encoding='utf-8')
          if 'CsvSchemaVersion = 7' not in csv_text:
              raise SystemExit('Unexpected contact CSV schema')
          if ('LegacyCacheUseCount' in csv_text or
                  'LegacyBroadPhaseStatistics' in csv_text):
              raise SystemExit('Legacy CSV columns returned')
          PY

      - name: Validate parallel Jacobi contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          solver = Path(
              'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/'
              'ParallelJacobiSolver.cs').read_text(encoding='utf-8')
          p1p6 = Path(
              'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/'
              'ParallelContactPipelineP1P6.cs').read_text(encoding='utf-8')
          base = Path(
              'Entities/Unit/Systems/FlowField/BaseFlowMovementSystem.cs'
          ).read_text(encoding='utf-8')
          required_solver = [
              'IJobParallelForDefer',
              'EvaluateParallelJacobiPairsJob',
              'GatherAndApplyParallelJacobiBodiesJob',
              'ActiveIncidentOffsets',
              'ScheduleParallelJacobi'
          ]
          required_capture = [
              'EvaluateParallelJacobiPairsWithDiagnosticsJob',
              'ParallelSimulationDebuggerPairCandidates',
              'CountParallelSimulationDebuggerPairBlocksJob',
              'PrefixParallelSimulationDebuggerPairsJob',
              'ScatterParallelSimulationDebuggerPairsJob',
              'MergeParallelSimulationDebuggerPairsJob'
          ]
          missing = [token for token in required_solver if token not in solver]
          missing += [token for token in required_capture if token not in p1p6]
          if missing:
              raise SystemExit('Parallel Jacobi contract missing: ' + repr(missing))
          if 'Interlocked' in solver or 'Atomic' in solver:
              raise SystemExit('Parallel Jacobi must not use floating-point atomics')
          if 'requiresSerialJacobiCapture' in base:
              raise SystemExit('Selected-pair capture must not change the Jacobi backend')
          if ('bool useParallelJacobi = usesJacobiScratch;' not in base or
                  'captureParallelSelectedPairs' not in base):
              raise SystemExit(
                  'Selected-pair capture must use the parallel pair-slot path')
          PY

      - name: Validate diagnostics build profile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          editor_settings = Path(
              'Entities/Unit/Systems/FlowField/Editor/'
              'SimulationDiagnosticsBuildSettings.cs')
          compile_status = Path(
              'Entities/Unit/Systems/FlowField/Diagnostics/'
              'SimulationDiagnosticsCompileStatus.cs')
          asset = Path(
              'Entities/Unit/Systems/FlowField/Editor/'
              'SimulationDiagnosticsBuildSettings.asset')
          for path in (editor_settings, compile_status, asset):
              if not path.exists():
                  raise SystemExit(f'Missing diagnostics build artifact: {path}')
          editor_text = editor_settings.read_text(encoding='utf-8')
          required = [
              'RTS_CONTACT_DIAGNOSTICS',
              'PlayerSettings.GetScriptingDefineSymbols',
              'PlayerSettings.SetScriptingDefineSymbols',
              'Editor Diagnostics',
              'Development Diagnostics',
              'Release Gameplay Only'
          ]
          missing = [token for token in required if token not in editor_text]
          if missing:
              raise SystemExit(
                  'Diagnostics build settings contract missing: ' + repr(missing))
          runtime_text = compile_status.read_text(encoding='utf-8')
          if 'UnityEditor' in runtime_text:
              raise SystemExit('Runtime compile status must not reference UnityEditor')
          PY

      - name: Validate simple source structure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          roots = [
              Path('Entities/Unit/Systems/FlowField/Jobs/ContactPipeline'),
              Path('Entities/Unit/Systems/FlowField/Diagnostics/Capture'),
              Path('Entities/Unit/Systems/FlowField/Diagnostics/Instrumentation'),
              Path('Entities/Unit/Systems/FlowField/Diagnostics/Validation')
          ]
          for root in roots:
              for path in root.rglob('*.cs'):
                  text = path.read_text(encoding='utf-8')
                  if text.count('{') != text.count('}'):
                      raise SystemExit(f'Brace mismatch: {path}')
          PY
