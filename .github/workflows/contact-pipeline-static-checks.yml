name: Contact pipeline refactor executor
on:
  push:
    branches:
      - 'codex/**'
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'chore: execute diagnostics refactor A'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild patch script
        shell: bash
        run: |
          set -euo pipefail
          cat .github/diagnostics-refactor/a_* > /tmp/refactor_a.b64
          base64 -d /tmp/refactor_a.b64 | gzip -d > /tmp/refactor_a.py
          python -m py_compile /tmp/refactor_a.py
      - name: Apply batches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python /tmp/refactor_a.py
          git push origin HEAD:${GITHUB_REF_NAME}
