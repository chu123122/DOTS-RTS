name: Contact pipeline refactor executor
on:
  pull_request:
    branches:
      - codex/simulation-integration
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'codex/diagnostics-refactor-runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply batches
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git log -1 --pretty=%s)" != "chore: execute diagnostics refactor A" ]; then
            echo "Head already transformed; skipping."
            exit 0
          fi
          cat .github/diagnostics-refactor/a_* > /tmp/refactor_a.b64
          base64 -d /tmp/refactor_a.b64 | gzip -d > /tmp/refactor_a.py
          python -m py_compile /tmp/refactor_a.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python /tmp/refactor_a.py
          git push origin HEAD:${GITHUB_HEAD_REF}
