name: Contact pipeline static checks

on:
  pull_request:
    paths:
      - 'Entities/Unit/Systems/FlowField/**'
      - '.github/workflows/contact-pipeline-static-checks.yml'
  push:
    branches:
      - Simulation
      - 'codex/**'
    paths:
      - 'Entities/Unit/Systems/FlowField/**'
      - '.github/workflows/contact-pipeline-static-checks.yml'

permissions:
  contents: read

jobs:
  static-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject legacy execution symbols
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          flow = Path('Entities/Unit/Systems/FlowField')
          source = '\n'.join(p.read_text(encoding='utf-8') for p in flow.rglob('*.cs'))
          names = [
              'BuildAdaptiveFatAabbHotspots',
              'BuildAdaptiveHybridContactPairs',
              'BuildContactPairsFromFatAabbCache',
              'EnsureFatAabbRawCandidates',
              'UpdateAdaptiveFatAabbHistoryAfterSolve',
              'AreCorrectedDiscsInsideFatCache'
          ]
          found = [name for name in names if re.search(rf'\b{re.escape(name)}\b', source)]
          if found:
              raise SystemExit('Legacy execution symbols returned: ' + ', '.join(found))
          PY

      - name: Reject ShadowStatistics field
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Rnw --include='*.cs' 'Entities/Unit/Systems/FlowField' \
            -e 'ShadowStatistics'

      - name: Reject LegacyBroadPhaseStatistics field
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Rnw --include='*.cs' 'Entities/Unit/Systems/FlowField' \
            -e 'LegacyBroadPhaseStatistics'

      - name: Reject LegacyBroadPhaseSource field
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Rnw --include='*.cs' 'Entities/Unit/Systems/FlowField' \
            -e 'LegacyBroadPhaseSource'

      - name: Reject MappedFatCachePairs field
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Rnw --include='*.cs' 'Entities/Unit/Systems/FlowField' \
            -e 'MappedFatCachePairs'

      - name: Reject legacy jobs hierarchy
        shell: bash
        run: |
          set -euo pipefail
          test ! -e Entities/Unit/Systems/FlowField/Jobs/Legacy

      - name: Validate compatibility boundary and scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          pipeline = Path('Entities/Unit/Systems/FlowField/Jobs/ContactPipeline')
          production = '\n'.join(p.read_text(encoding='utf-8') for p in pipeline.rglob('*.cs'))
          occurrences = [
              str(path) for path in pipeline.rglob('*.cs')
              if 'FatAabbCacheMargin' in path.read_text(encoding='utf-8')
          ]
          expected = str(pipeline / 'Core/ContactPipelineConfiguration.cs')
          if occurrences != [expected]:
              raise SystemExit(
                  'Serialized FatAabb margin escaped compatibility boundary: ' +
                  repr(occurrences))
          if re.search(
                  r'\b(?:SleepingBody|SleepingIsland|ContactIslandSleeping)\b',
                  production):
              raise SystemExit(
                  'Sleeping policy introduced without a dedicated design stage')
          PY

      - name: Validate type ownership and temporary artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          pipeline = Path('Entities/Unit/Systems/FlowField/Jobs/ContactPipeline')
          ownership = {
              'public struct UnitCollisionPair': pipeline / 'Core/ContactPairTypes.cs',
              'public struct SweptDiscCellEntry': pipeline / 'BroadPhase/SweptDiscTypes.cs'
          }
          for symbol, expected_path in ownership.items():
              paths = [
                  path for path in pipeline.rglob('*.cs')
                  if symbol in path.read_text(encoding='utf-8')
              ]
              if paths != [expected_path]:
                  raise SystemExit(f'{symbol} ownership mismatch: {paths}')
          temp = list(Path('.github/workflows').glob(
              'refactor-contact-pipeline-phase*.yml'))
          temp += list(Path('.github/workflows').glob('audit-*.yml'))
          if temp:
              raise SystemExit('Temporary workflows remain: ' + repr(temp))
          PY

      - name: Validate diagnostics schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          csv_path = Path(
              'Entities/Unit/Systems/FlowField/Diagnostics/'
              'IncrementalContactPipelineCsvRecorder.cs')
          csv_text = csv_path.read_text(encoding='utf-8')
          if 'CsvSchemaVersion = 7' not in csv_text:
              raise SystemExit('Unexpected contact CSV schema')
          if ('LegacyCacheUseCount' in csv_text or
                  'LegacyBroadPhaseStatistics' in csv_text):
              raise SystemExit('Legacy CSV columns returned')
          PY

      - name: Validate simple source structure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          pipeline = Path('Entities/Unit/Systems/FlowField/Jobs/ContactPipeline')
          for path in pipeline.rglob('*.cs'):
              text = path.read_text(encoding='utf-8')
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'Brace mismatch: {path}')
          PY
