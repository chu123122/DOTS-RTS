name: Replay contact pipeline clean v3

on:
  push:
    branches:
      - codex/contact-pipeline-parallel-p1-p6-clean
    paths:
      - .github/workflows/replay-contact-pipeline-clean-v3.yml
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/replay-contact-pipeline-clean-v3.yml

permissions:
  contents: write

concurrency:
  group: replay-contact-pipeline-clean-v3
  cancel-in-progress: false

jobs:
  replay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/contact-pipeline-parallel-p1-p6-clean

      - name: Replay exact business scope
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master codex/contact-pipeline-parallel-p1-p6
          SOURCE=origin/codex/contact-pipeline-parallel-p1-p6
          git checkout "$SOURCE" -- \
            Entities/Unit/Systems/FlowField/BaseFlowMovementSystem.PersistentIncidentIndex.cs \
            Entities/Unit/Systems/FlowField/BaseFlowMovementSystem.cs \
            Entities/Unit/Systems/FlowField/Diagnostics/IncrementalContactPipelineDiagnostics.cs \
            Entities/Unit/Systems/FlowField/Diagnostics/SimulationDebuggerSnapshotPublishing.cs \
            Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/DEBT.md \
            Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Persistent/IncrementalPredictiveContactPipeline.cs \
            Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Persistent/PersistentParallelClassificationP1P6.cs \
            Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/ActiveConstraintIncidentIndex.cs \
            Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/ParallelContactPipelineP1P6.cs
          git rm .github/workflows/replay-contact-pipeline-clean.yml
          git rm .github/workflows/replay-contact-pipeline-clean-v2.yml
          git rm .github/workflows/replay-contact-pipeline-clean-v3.yml

      - name: Validate scope and contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          expected = {
              'Entities/Unit/Systems/FlowField/BaseFlowMovementSystem.PersistentIncidentIndex.cs',
              'Entities/Unit/Systems/FlowField/BaseFlowMovementSystem.cs',
              'Entities/Unit/Systems/FlowField/Diagnostics/IncrementalContactPipelineDiagnostics.cs',
              'Entities/Unit/Systems/FlowField/Diagnostics/SimulationDebuggerSnapshotPublishing.cs',
              'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/DEBT.md',
              'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Persistent/IncrementalPredictiveContactPipeline.cs',
              'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Persistent/PersistentParallelClassificationP1P6.cs',
              'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/ActiveConstraintIncidentIndex.cs',
              'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/ParallelContactPipelineP1P6.cs',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/master'], text=True).splitlines())
          if changed != expected:
              raise SystemExit('unexpected replay scope: ' + repr(sorted(changed ^ expected)))

          root = Path('.')
          base = (root / 'Entities/Unit/Systems/FlowField/BaseFlowMovementSystem.cs').read_text()
          staged = (root / 'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/ParallelContactPipelineP1P6.cs').read_text()
          incident = (root / 'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/ActiveConstraintIncidentIndex.cs').read_text()
          persistent = (root / 'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Persistent/IncrementalPredictiveContactPipeline.cs').read_text()
          p5 = (root / 'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Persistent/PersistentParallelClassificationP1P6.cs').read_text()
          support = (root / 'Entities/Unit/Systems/FlowField/BaseFlowMovementSystem.PersistentIncidentIndex.cs').read_text()
          debugger = (root / 'Entities/Unit/Systems/FlowField/Diagnostics/SimulationDebuggerSnapshotPublishing.cs').read_text()
          diagnostics = (root / 'Entities/Unit/Systems/FlowField/Diagnostics/IncrementalContactPipelineDiagnostics.cs').read_text()
          scheduler_prefix = p5.split(
              'private struct EvaluatePersistentPairClassificationsP1P6Job', 1)[0]
          required = {
              'staged scheduler': 'ScheduleParallelJacobiP1P6' in base and 'ScheduleParallelJacobiP1P6' in staged,
              'parallel prediction': 'PrepareTimestepPredictionBodiesJob : IJobParallelFor' in staged,
              'parallel soft pair': 'EvaluateSoftAvoidancePairsJob : IJobParallelForDefer' in staged,
              'parallel soft gather': 'GatherSoftAvoidanceBodiesJob : IJobParallelFor' in staged,
              'parallel wall': 'SolveWallConstraintBodiesJob : IJobParallelFor' in staged,
              'parallel velocity': 'ReconstructVelocityBodiesJob : IJobParallelFor' in staged,
              'active incident reuse': 'EnsureActiveConstraintIncidentIndexP1P6' in incident,
              'persistent incident index': 'PersistentIncidentPairLookup.TryGetFirstValue' in persistent,
              'persistent membership': 'NativeParallelMultiHashMap<int, int> _persistentSpatialMembership' in support,
              'spatial query': 'TryAppendPersistentSpatialNeighborsP1P6' in persistent,
              'parallel classification': 'EvaluatePersistentPairClassificationsP1P6Job : IJobParallelForDefer' in p5,
              'phase dependency': 'PhaseState = PersistentClassificationState' in p5,
              'no scheduler cache read': 'Timestep = IncrementalCacheState.Value.Timestep,' not in scheduler_prefix,
              'deterministic commit': 'CommitPersistentClassificationP1P6' in p5 and 'AsArray().Sort' in p5,
              'validated timestep': 'LastValidatedTimestep = validatedTimestep' in p5,
              'nonblocking debugger': 'if (!Dependency.IsCompleted)' in debugger,
              'previous-frame diagnostics': 'SimulationSystemGroup' in diagnostics and 'PresentationSystemGroup' not in diagnostics,
              'no frame log': 'SingletonSolver=' not in base,
          }
          failed = [name for name, ok in required.items() if not ok]
          if failed:
              raise SystemExit('missing contracts: ' + ', '.join(failed))
          for path in [
              root / 'Entities/Unit/Systems/FlowField/BaseFlowMovementSystem.cs',
              root / 'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/ParallelContactPipelineP1P6.cs',
              root / 'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Persistent/PersistentParallelClassificationP1P6.cs',
              root / 'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Persistent/IncrementalPredictiveContactPipeline.cs',
          ]:
              text = path.read_text()
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'unbalanced braces: {path}')
          PY

      - name: CSharp syntax smoke
        run: |
          CSC="$(find /usr/share/dotnet/sdk -path '*/Roslyn/bincore/csc.dll' | sort -V | tail -1)"
          set +e
          dotnet "$CSC" /nologo /noconfig /nostdlib /target:library \
            Entities/Unit/Systems/FlowField/BaseFlowMovementSystem.cs \
            Entities/Unit/Systems/FlowField/BaseFlowMovementSystem.PersistentIncidentIndex.cs \
            Entities/Unit/Systems/FlowField/Diagnostics/IncrementalContactPipelineDiagnostics.cs \
            Entities/Unit/Systems/FlowField/Diagnostics/SimulationDebuggerSnapshotPublishing.cs \
            Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/ParallelContactPipelineP1P6.cs \
            Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Persistent/PersistentParallelClassificationP1P6.cs \
            Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Persistent/IncrementalPredictiveContactPipeline.cs \
            > replay-csharp-smoke.txt 2>&1
          set -e
          if grep -E 'error CS(1001|1002|1003|1009|1010|1022|1026|1031|1513|1514|1519|1525|1529|1530|8803)' replay-csharp-smoke.txt; then
            cat replay-csharp-smoke.txt
            exit 1
          fi

      - name: Publish new one-commit branch
        run: |
          set -euo pipefail
          git reset --soft origin/master
          git add -A
          test "$(git diff --cached --name-only | wc -l)" -eq 9
          git commit -m "perf: parallelize contact pipeline coordination"
          git push origin HEAD:refs/heads/codex/contact-pipeline-parallel-p1-p6-final
