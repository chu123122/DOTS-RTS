name: Diagnose hard cutover payload

on:
  pull_request:
    branches:
      - Simulation
    paths:
      - '.github/workflows/diagnose-hard-cutover-final.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/simulation-integration
          fetch-depth: 1
      - name: Collect payload statistics
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          root = Path('.github/cutover/final')
          lines = []
          for path in sorted(root.rglob('*.b64')):
              data = path.read_bytes()
              lines.append(f'{path} {len(data)} {sha256(data).hexdigest()}')

          for phase in ('phase3', 'phase4', 'phase5'):
              data = b''.join(path.read_bytes() for path in sorted((root / phase).glob('*.b64')))
              lines.append(f'/tmp/{phase}.b64 {len(data)} {sha256(data).hexdigest()}')

          output = Path('/tmp/payload-stats.txt')
          output.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(output.read_text(encoding='utf-8'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-cutover-payload-stats
          path: /tmp/payload-stats.txt
          if-no-files-found: error
          retention-days: 1
