name: Contact pipeline P1-P6 migration

on:
  push:
    branches:
      - codex/contact-pipeline-parallel-p1-p6
    paths:
      - .github/workflows/contact-pipeline-p1-p6-migration.yml
      - .github/scripts/apply_contact_pipeline_p1_p6.py

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/contact-pipeline-parallel-p1-p6

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate migration script
        run: python3 -m py_compile .github/scripts/apply_contact_pipeline_p1_p6.py

      - name: P1 clean baseline and preserve envelope semantics
        run: |
          python3 .github/scripts/apply_contact_pipeline_p1_p6.py --phase 1
          git add -A
          git commit -m "perf: establish contact pipeline parallel baseline"

      - name: P2 integrate staged body jobs
        run: |
          python3 .github/scripts/apply_contact_pipeline_p1_p6.py --phase 2
          git add -A
          git commit -m "perf: parallelize independent contact body stages"

      - name: P3 record soft avoidance gather migration
        run: |
          python3 .github/scripts/apply_contact_pipeline_p1_p6.py --phase 3
          git add -A
          git commit -m "perf: migrate soft avoidance to pair gather"

      - name: P4 reuse active incident index
        run: |
          python3 .github/scripts/apply_contact_pipeline_p1_p6.py --phase 4
          git add -A
          git commit -m "perf: reuse active constraint incident index"

      - name: P5 add persistent incident lookup
        run: |
          python3 .github/scripts/apply_contact_pipeline_p1_p6.py --phase 5
          git add -A
          git commit -m "perf: index persistent incident pairs"

      - name: P6 defer diagnostics publication
        run: |
          python3 .github/scripts/apply_contact_pipeline_p1_p6.py --phase 6
          git add -A
          git commit -m "perf: remove current-frame diagnostic waits"

      - name: Static structural checks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          base = (root / 'Entities/Unit/Systems/FlowField/BaseFlowMovementSystem.cs').read_text()
          staged = (root / 'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/ParallelContactPipelineP1P6.cs').read_text()
          incident = (root / 'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/ActiveConstraintIncidentIndex.cs').read_text()
          diagnostics = (root / 'Entities/Unit/Systems/FlowField/Diagnostics/SimulationDebuggerSnapshotPublishing.cs').read_text()
          persistent = (root / 'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Persistent/IncrementalPredictiveContactPipeline.cs').read_text()

          required = {
              'new scheduler': 'ScheduleParallelJacobiP1P6' in base and 'ScheduleParallelJacobiP1P6' in staged,
              'soft pair parallel': 'EvaluateSoftAvoidancePairsJob : IJobParallelForDefer' in staged,
              'soft body gather': 'GatherSoftAvoidanceBodiesJob : IJobParallelFor' in staged,
              'wall body parallel': 'SolveWallConstraintBodiesJob : IJobParallelFor' in staged,
              'motion body parallel': 'PredictUnconstrainedBodiesJob : IJobParallelFor' in staged,
              'incident reuse': 'EnsureActiveConstraintIncidentIndexP1P6' in incident,
              'persistent lookup': 'PersistentIncidentPairLookup.TryGetFirstValue' in persistent,
              'nonblocking debugger': 'if (!Dependency.IsCompleted)' in diagnostics,
              'no frame log': 'SingletonSolver=' not in base,
          }
          failed = [name for name, ok in required.items() if not ok]
          if failed:
              raise SystemExit('missing contracts: ' + ', '.join(failed))

          for path in [
              root / 'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/ParallelContactPipelineP1P6.cs',
              root / 'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/ActiveConstraintIncidentIndex.cs',
              root / 'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Persistent/IncrementalPredictiveContactPipeline.cs',
              root / 'Entities/Unit/Systems/FlowField/BaseFlowMovementSystem.cs',
          ]:
              text = path.read_text()
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'unbalanced braces: {path}')
          PY

      - name: Push phase commits
        run: git push origin HEAD:codex/contact-pipeline-parallel-p1-p6

# Trigger revision 1
