name: Contact pipeline P5B P5C

on:
  push:
    branches:
      - codex/contact-pipeline-parallel-p1-p6
    paths:
      - .github/workflows/contact-pipeline-p5bc.yml
      - .github/scripts/apply_contact_pipeline_p5bc.py
      - Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Persistent/PersistentParallelClassificationP1P6.cs
      - Entities/Unit/Systems/FlowField/BaseFlowMovementSystem.PersistentIncidentIndex.cs
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/contact-pipeline-p5bc.yml
      - .github/scripts/apply_contact_pipeline_p5bc.py
      - Entities/Unit/Systems/FlowField/**

permissions:
  contents: write

concurrency:
  group: contact-pipeline-p5bc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/contact-pipeline-parallel-p1-p6

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply P5B P5C
        run: |
          python3 -m py_compile .github/scripts/apply_contact_pipeline_p5bc.py
          rm -rf .github/scripts/__pycache__
          python3 .github/scripts/apply_contact_pipeline_p5bc.py
          git add Entities/Unit/Systems/FlowField
          git commit -m "perf: complete persistent contact pipeline stages"

      - name: Structural contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          base = (root / 'Entities/Unit/Systems/FlowField/BaseFlowMovementSystem.cs').read_text()
          support = (root / 'Entities/Unit/Systems/FlowField/BaseFlowMovementSystem.PersistentIncidentIndex.cs').read_text()
          staged = (root / 'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/ParallelContactPipelineP1P6.cs').read_text()
          p5 = (root / 'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Persistent/PersistentParallelClassificationP1P6.cs').read_text()
          persistent = (root / 'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Persistent/IncrementalPredictiveContactPipeline.cs').read_text()

          required = {
              'P5C scheduler': 'ScheduleInitialPersistentContactSetP1P6' in staged,
              'P5C pair job': 'EvaluatePersistentPairClassificationsP1P6Job : IJobParallelForDefer' in p5,
              'P5C deterministic commit': 'CommitPersistentClassificationP1P6' in p5 and 'AsArray().Sort' in p5,
              'P5B persistent membership': 'NativeParallelMultiHashMap<int, int> _persistentSpatialMembership' in support,
              'P5B versioned rebuild': 'PersistentSpatialMembershipEpoch.Value = targetEpoch' in p5,
              'P5B cell query': 'TryAppendPersistentSpatialNeighborsP1P6' in persistent,
              'P5B fallback': 'authoritative O(N) path' in persistent,
              'lifecycle wiring': 'PersistentClassificationResults = persistentClassificationResults' in base,
              'dispose wiring': 'persistentClassificationResults.Dispose' in base,
          }
          failed = [name for name, ok in required.items() if not ok]
          if failed:
              raise SystemExit('missing contracts: ' + ', '.join(failed))

          for path in [
              root / 'Entities/Unit/Systems/FlowField/BaseFlowMovementSystem.cs',
              root / 'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/ParallelContactPipelineP1P6.cs',
              root / 'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Persistent/PersistentParallelClassificationP1P6.cs',
              root / 'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Persistent/IncrementalPredictiveContactPipeline.cs',
          ]:
              text = path.read_text()
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'unbalanced braces: {path}')
          PY

      - name: CSharp syntax smoke
        run: |
          CSC="$(find /usr/share/dotnet/sdk -path '*/Roslyn/bincore/csc.dll' | sort -V | tail -1)"
          set +e
          dotnet "$CSC" /nologo /noconfig /nostdlib /target:library \
            Entities/Unit/Systems/FlowField/BaseFlowMovementSystem.cs \
            Entities/Unit/Systems/FlowField/BaseFlowMovementSystem.PersistentIncidentIndex.cs \
            Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/ParallelContactPipelineP1P6.cs \
            Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Persistent/PersistentParallelClassificationP1P6.cs \
            Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Persistent/IncrementalPredictiveContactPipeline.cs \
            > p5bc-csharp-smoke.txt 2>&1
          set -e
          if grep -E 'error CS(1001|1002|1003|1009|1010|1022|1026|1031|1513|1514|1519|1525|1529|1530|8803)' p5bc-csharp-smoke.txt; then
            cat p5bc-csharp-smoke.txt
            exit 1
          fi

      - name: Push phase commit
        run: git push origin HEAD:codex/contact-pipeline-parallel-p1-p6
