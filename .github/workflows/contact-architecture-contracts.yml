name: Contact architecture contracts

on:
  pull_request:
    paths:
      - 'Entities/Unit/Systems/FlowField/**'
      - '.github/scripts/validate_contact_architecture.py'
      - '.github/workflows/contact-architecture-contracts.yml'
  push:
    branches:
      - Simulation
      - codex/simulation-integration
    paths:
      - 'Entities/Unit/Systems/FlowField/**'
      - '.github/scripts/validate_contact_architecture.py'
      - '.github/workflows/contact-architecture-contracts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/simulation-integration
          fetch-depth: 2
      - name: Validate candidate-certifier-consumer boundaries
        run: python3 .github/scripts/validate_contact_architecture.py
      - name: Update permanent Jacobi ownership contract
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/contact-pipeline-static-checks.yml')
          text = path.read_text(encoding='utf-8')
          old = """          solver = Path(
              'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/'
              'ParallelJacobiSolver.cs').read_text(encoding='utf-8')
          p1p6 = Path(
              'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/'
              'ParallelContactPipelineP1P6.cs').read_text(encoding='utf-8')
          base = Path(
              'Entities/Unit/Systems/FlowField/BaseFlowMovementSystem.cs'
          ).read_text(encoding='utf-8')
          required_solver = [
              'IJobParallelForDefer',
              'EvaluateParallelJacobiPairsJob',
              'GatherAndApplyParallelJacobiBodiesJob',
              'ActiveIncidentOffsets',
              'ScheduleParallelJacobi'
          ]
          required_capture = [
              'EvaluateParallelJacobiPairsWithDiagnosticsJob',
              'ParallelSimulationDebuggerPairCandidates',
              'CountParallelSimulationDebuggerPairBlocksJob',
              'PrefixParallelSimulationDebuggerPairsJob',
              'ScatterParallelSimulationDebuggerPairsJob',
              'MergeParallelSimulationDebuggerPairsJob'
          ]
          missing = [token for token in required_solver if token not in solver]
          missing += [token for token in required_capture if token not in p1p6]
"""
          new = """          solver = Path(
              'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/'
              'ParallelJacobiSolver.cs').read_text(encoding='utf-8')
          p1p6 = Path(
              'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/'
              'ParallelContactPipelineP1P6.cs').read_text(encoding='utf-8')
          resources = Path(
              'Entities/Unit/Systems/FlowField/ConstraintSolverFrameResources.cs'
          ).read_text(encoding='utf-8')
          stage_jobs = Path(
              'Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Core/'
              'ContactPipelineStageJobs.cs').read_text(encoding='utf-8')
          base = Path(
              'Entities/Unit/Systems/FlowField/BaseFlowMovementSystem.cs'
          ).read_text(encoding='utf-8')
          required_solver = [
              'IJobParallelForDefer',
              'EvaluateParallelJacobiPairsJob',
              'GatherAndApplyParallelJacobiBodiesJob'
          ]
          required_p1p6 = [
              'ScheduleParallelJacobiP1P6',
              'EvaluateParallelJacobiPairsWithDiagnosticsJob',
              'ParallelSimulationDebuggerPairCandidates',
              'CountParallelSimulationDebuggerPairBlocksJob',
              'PrefixParallelSimulationDebuggerPairsJob',
              'ScatterParallelSimulationDebuggerPairsJob',
              'ConstraintSolverOperation.MergeParallelDebuggerPairs'
          ]
          required_resources = [
              'ActiveIncidentOffsets',
              'ActiveIncidentPairIndices',
              'JacobiPairCorrections'
          ]
          required_stage_jobs = [
              'MergeParallelDebuggerPairs',
              'ConstraintSolverOperation'
          ]
          missing = [token for token in required_solver if token not in solver]
          missing += [token for token in required_p1p6 if token not in p1p6]
          missing += [token for token in required_resources if token not in resources]
          missing += [token for token in required_stage_jobs if token not in stage_jobs]
"""
          if text.count(old) != 1:
              raise SystemExit('parallel Jacobi contract block did not match exactly')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/diagnose-final-ownership.yml
          rm -f .github/workflows/update-parallel-jacobi-contract.yml
          git show HEAD^:.github/workflows/contact-architecture-contracts.yml > .github/workflows/contact-architecture-contracts.yml
          git add -A
      - name: Validate updated contracts
        if: github.event_name == 'pull_request'
        run: |
          python3 .github/scripts/validate_contact_pipeline_audit.py
          python3 .github/scripts/validate_contact_diagnostics.py
          python3 .github/scripts/validate_contact_architecture.py
          python3 - <<'PY'
          from pathlib import Path
          solver = Path('Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/ParallelJacobiSolver.cs').read_text(encoding='utf-8')
          p1p6 = Path('Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/ParallelContactPipelineP1P6.cs').read_text(encoding='utf-8')
          resources = Path('Entities/Unit/Systems/FlowField/ConstraintSolverFrameResources.cs').read_text(encoding='utf-8')
          stage_jobs = Path('Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Core/ContactPipelineStageJobs.cs').read_text(encoding='utf-8')
          required = {
              'solver': (solver, ('IJobParallelForDefer', 'EvaluateParallelJacobiPairsJob', 'GatherAndApplyParallelJacobiBodiesJob')),
              'p1p6': (p1p6, ('ScheduleParallelJacobiP1P6', 'ConstraintSolverOperation.MergeParallelDebuggerPairs')),
              'resources': (resources, ('ActiveIncidentOffsets', 'ActiveIncidentPairIndices', 'JacobiPairCorrections')),
              'stage jobs': (stage_jobs, ('MergeParallelDebuggerPairs', 'ConstraintSolverOperation')),
          }
          for owner, (text, tokens) in required.items():
              missing = [token for token in tokens if token not in text]
              if missing:
                  raise SystemExit(f'{owner} Jacobi ownership missing: {missing}')
          PY
          git diff --cached --check
      - name: Commit updated ownership checks
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "update parallel Jacobi ownership checks"
          git push origin HEAD:codex/simulation-integration
