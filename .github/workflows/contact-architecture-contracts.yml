name: Contact architecture contracts

on:
  pull_request:
    paths:
      - 'Entities/Unit/Systems/FlowField/**'
      - '.github/scripts/validate_contact_architecture.py'
      - '.github/workflows/contact-architecture-contracts.yml'
  push:
    branches:
      - Simulation
      - codex/simulation-integration
    paths:
      - 'Entities/Unit/Systems/FlowField/**'
      - '.github/scripts/validate_contact_architecture.py'
      - '.github/workflows/contact-architecture-contracts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/simulation-integration
          fetch-depth: 1
      - name: Validate candidate-certifier-consumer boundaries
        run: python3 .github/scripts/validate_contact_architecture.py
      # The complete phase-one payload is staged under .github/cutover/phase-1.
      - name: Apply staged phase-one hard cutover
        if: github.event_name == 'pull_request'
        run: |
          if [ ! -f Entities/Unit/Systems/FlowField/Jobs/FlowMovementFrameState.cs ]; then
            echo "Phase one already applied"
            exit 0
          fi
          cat .github/cutover/phase-1/chunk-*.b64 | base64 -d | gzip -d > /tmp/phase-1.patch
          git apply --index /tmp/phase-1.patch
          python3 .github/scripts/validate_contact_pipeline_audit.py
          python3 .github/scripts/validate_contact_diagnostics.py
          python3 .github/scripts/validate_contact_architecture.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "hard cutover crowd body data"
          git push origin HEAD:codex/simulation-integration
