name: Contact architecture contracts

on:
  pull_request:
    paths:
      - 'Entities/Unit/Systems/FlowField/**'
      - '.github/scripts/validate_contact_architecture.py'
      - '.github/workflows/contact-architecture-contracts.yml'
  push:
    branches:
      - Simulation
      - codex/simulation-integration
    paths:
      - 'Entities/Unit/Systems/FlowField/**'
      - '.github/scripts/validate_contact_architecture.py'
      - '.github/workflows/contact-architecture-contracts.yml'
  workflow_dispatch:

jobs:
  validate-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate candidate-certifier-consumer boundaries
        run: python3 .github/scripts/validate_contact_architecture.py
      - name: Pack cutover source
        run: |
          git rev-parse HEAD > CUTOVER_SOURCE_HEAD.txt
          tar --exclude='.git' -czf /tmp/dots-rts-cutover-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: dots-rts-cutover-source
          path: /tmp/dots-rts-cutover-source.tar.gz
          if-no-files-found: error
          retention-days: 1
