name: Finalize contact evaluation accessibility

on:
  pull_request:
    branches:
      - Simulation
    paths:
      - '.github/workflows/fix-contact-evaluation-accessibility.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/simulation-integration
          fetch-depth: 50
      - name: Narrow solver-local evaluation API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/XpbdContactSolver.cs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'public static class XpbdContactConstraintMath': 'internal static class XpbdContactConstraintMath',
              '    public static ContactConstraintEvaluation Evaluate(': '    internal static ContactConstraintEvaluation Evaluate(',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one occurrence of {old!r}, found {text.count(old)}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-contact-evaluation-accessibility.yml
          git add -A
      - name: Validate final source contracts
        run: |
          python3 .github/scripts/validate_contact_pipeline_audit.py
          python3 .github/scripts/validate_contact_diagnostics.py
          python3 .github/scripts/validate_contact_architecture.py
          python3 - <<'PY'
          from pathlib import Path
          text = Path('Entities/Unit/Systems/FlowField/Jobs/ContactPipeline/Solver/XpbdContactSolver.cs').read_text(encoding='utf-8')
          required = (
              'internal struct ContactConstraintEvaluation',
              'internal static class XpbdContactConstraintMath',
              'internal static ContactConstraintEvaluation Evaluate(',
          )
          for token in required:
              if text.count(token) != 1:
                  raise SystemExit(f'accessibility contract mismatch for {token!r}')
          PY
          git diff --cached --check
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "narrow solver evaluation API"
          git push origin HEAD:codex/simulation-integration
