name: Apply hard cutover phase 1

on:
  pull_request:
    branches:
      - Simulation
    paths:
      - '.github/cutover/phase-1/**'
      - '.github/workflows/apply-hard-cutover-phase-1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: hard-cutover-phase-1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/simulation-integration
          fetch-depth: 50
      - uses: actions/upload-artifact@v4
        with:
          name: phase-1-corrupted-chunks
          path: |
            .github/cutover/phase-1/chunk-00.b64
            .github/cutover/phase-1/chunk-05.b64
          include-hidden-files: true
          retention-days: 1
      - name: Reconstruct verified patch
        shell: bash
        run: |
          rm -f /tmp/phase-1.b64
          for index in 00 01 02 03 04 05 06; do
            head -c 7000 ".github/cutover/phase-1/chunk-${index}.b64" >> /tmp/phase-1.b64
          done
          head -c 112 .github/cutover/phase-1/chunk-07.b64 >> /tmp/phase-1.b64
          echo '7d7c9c532b0bb3a3163d40e80e9c80bb02a2f320d42a584179cee4cfcc6aa029  /tmp/phase-1.b64' | sha256sum --check
          base64 -d /tmp/phase-1.b64 > /tmp/phase-1.patch.gz
          gzip -t /tmp/phase-1.patch.gz
          gzip -dc /tmp/phase-1.patch.gz > /tmp/phase-1.patch
          echo 'ef25d5f9b1526de07294c2d6f70059963162aef284869e7ca5dbfd6c7c5966c7  /tmp/phase-1.patch' | sha256sum --check
          git apply --check --3way /tmp/phase-1.patch
      - name: Apply phase patch
        run: git apply --index --3way /tmp/phase-1.patch
      - name: Remove transfer scaffolding
        run: |
          rm -rf .github/cutover/phase-1
          rm -f .github/workflows/apply-hard-cutover-phase-1.yml
          rm -f .github/workflows/export-cutover-source.yml
          git add -A
      - name: Validate source contracts
        run: |
          python3 .github/scripts/validate_contact_pipeline_audit.py
          python3 .github/scripts/validate_contact_diagnostics.py
          python3 .github/scripts/validate_contact_architecture.py
          git diff --cached --check
      - name: Commit hard cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "hard cutover crowd body data"
          git push origin HEAD:codex/simulation-integration
