name: Apply hard cutover phase 1

on:
  pull_request:
    branches:
      - Simulation
    paths:
      - '.github/cutover/phase-1/**'
      - '.github/workflows/apply-hard-cutover-phase-1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: hard-cutover-phase-1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/simulation-integration
          fetch-depth: 1
      - name: Restore phase patch
        run: |
          cat .github/cutover/phase-1/chunk-*.b64 | base64 -d | gzip -d > /tmp/phase-1.patch
          git apply --index /tmp/phase-1.patch
      - name: Remove transfer scaffolding
        run: |
          rm -rf .github/cutover/phase-1
          rm -f .github/workflows/apply-hard-cutover-phase-1.yml
          rm -f .github/workflows/export-cutover-source.yml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/contact-architecture-contracts.yml')
          text = path.read_text(encoding='utf-8')
          marker = '      - name: Pack cutover source\n'
          if marker in text:
              text = text.split(marker, 1)[0]
          path.write_text(text, encoding='utf-8')
          PY
          git add -A
      - name: Validate source contracts
        run: |
          python3 .github/scripts/validate_contact_pipeline_audit.py
          python3 .github/scripts/validate_contact_diagnostics.py
          python3 .github/scripts/validate_contact_architecture.py
          git diff --cached --check
      - name: Commit hard cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "hard cutover crowd body data"
          git push origin HEAD:codex/simulation-integration
